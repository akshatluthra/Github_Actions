name: Dependency Job Workflow
on: [push]
jobs:
    build:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout code
              uses: actions/checkout@v2
            
            - name: run a simple command
              run: echo "Hello, Guys, This is a dependency job workflow!"
    test:
        runs-on: ubuntu-latest
        needs: build
        steps:
            - name: checkout code
              uses: actions/checkout@v2
            - name: run tests
              run: echo "Running tests..."

    deploy:
        runs-on: ubuntu-latest
        needs: test
        steps:
            - name: checkout code
              uses: actions/checkout@v2

            - name: Run a simple command
              run: echo "Running deploy job..."
